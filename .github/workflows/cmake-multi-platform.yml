name: CADventory CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BRLCAD_VERSION: "7.40.2"
  BRLCAD_TAG: "rel-7-40-2"
  QT_VERSION: "6.9.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            gui: ON
          - name: macos-clang-release
            os: macos-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            gui: ON
          - os: windows-latest
            name: windows-msvc-release
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            gui: ON

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.1.1
      with:
        version: ${{ env.QT_VERSION }}

    - name: Install BRL-CAD (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Download BRL-CAD installer (.exe) from GitHub Releases
        Invoke-WebRequest -Uri "https://github.com/BRL-CAD/brlcad/releases/download/${{ env.BRLCAD_TAG }}/BRL-CAD_${{ env.BRLCAD_VERSION }}_win64.exe" -OutFile "brlcad-installer.exe"
        # Run the installer silently
        Start-Process -FilePath ".\brlcad-installer.exe" -ArgumentList "/S" -Wait
        echo 'CMAKE_PREFIX_PATH="C:/Program Files/BRL-CAD ${{ env.BRLCAD_VERSION }}"' >> $env:GITHUB_ENV
        echo 'BRLCAD_ROOT="C:/Program Files/BRL-CAD ${{ env.BRLCAD_VERSION }}"' >> $env:GITHUB_ENV

    - name: Install BRL-CAD (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget "https://github.com/BRL-CAD/brlcad/releases/download/${{ env.BRLCAD_TAG }}/BRL-CAD_${{ env.BRLCAD_VERSION }}_Linux_x86_64.tar.gz" -O brlcad.tar.gz
        mkdir -p $HOME/brlcad
        tar -xzf brlcad.tar.gz -C $HOME/brlcad --strip-components=1
        echo "BRLCAD_ROOT=$HOME/brlcad" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$HOME/brlcad" >> $GITHUB_ENV

    - name: Install BRL-CAD (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        curl -L -o brlcad.tar.gz "https://github.com/BRL-CAD/brlcad/releases/download/${{ env.BRLCAD_TAG }}/BRL-CAD_${{ env.BRLCAD_VERSION }}_macos.tar.gz"
        mkdir -p $HOME/brlcad
        tar -xzf brlcad.tar.gz -C $HOME/brlcad --strip-components=1
        echo "BRLCAD_ROOT=$HOME/brlcad" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$HOME/brlcad" >> $GITHUB_ENV

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCADVENTORY_WITH_GUI=${{ matrix.gui }}
        -DCADVENTORY_USE_SQLITE=ON
        -DQt6_DIR="${{ env.Qt6_DIR }}"
        -DBRLCAD_ROOT=${{ env.BRLCAD_ROOT }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Prepare headless env (Linux/MacOS)
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      run: |
        echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
        echo "XDG_RUNTIME_DIR=/tmp/runtime" >> $GITHUB_ENV
        mkdir -p /tmp/runtime

    - name: Prepare headless env (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        echo "QT_QPA_PLATFORM=offscreen" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --timeout 600
